# The bundled rules target hyperliquid-exporter v4.0.7 metrics.  Optional
# monitors are guarded by their source state so a disabled or unavailable
# input does not look like a node failure.
groups:
  - name: hyperliquid_node_health
    rules:
      - alert: HyperliquidExporterDown
        expr: up{job=~"hyperliquid|hyperliquid-exporter(/.*)?"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Hyperliquid exporter scrape target is down"
          description: "Prometheus has not successfully scraped the exporter target for 2 minutes."

      - alert: HyperliquidExporterNotReady
        expr: |
          (hl_exporter_ready == 0)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid exporter has not reached startup readiness"
          description: "Registered exporter workers have not all started after 5 minutes. Readiness does not attest node data health."

      - alert: HyperliquidNodeProcessDown
        expr: |
          (hl_node_process_up{process="hl-node"} == 0)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?",node_mode="host"} == 1)
            and on(job, instance)
          (hl_exporter_source_enabled{source="process"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="process"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="process"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The hl-node process is not present"
          description: "Complete valid procfs scans have not found the hl-node process for 2 minutes."

      - alert: HyperliquidVisorProcessDown
        expr: |
          (hl_node_process_up{process="hl-visor"} == 0)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?",node_mode="host"} == 1)
            and on(job, instance)
          (hl_exporter_source_enabled{source="process"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="process"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="process"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The hl-visor process is not present"
          description: "Complete valid procfs scans have not found the hl-visor process for 2 minutes."

      - alert: NodeNotInSync
        expr: |
          (max without(source) (
            hl_visor_last_observation_age_seconds
              or
            hl_exporter_source_last_valid_age_seconds{source="visor"}
          ) > 60)
            and on(job, instance)
          (hl_exporter_source_enabled{source="visor"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="visor"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="visor"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="visor"} == 1)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Visor observation is stale"
          description: "Visor observation or exporter receipt age is above 60 seconds. This does not prove that the network or every node process is out of sync."

      - alert: HyperliquidSnapshotEvidenceStale
        expr: |
          (max without(source) (
            hl_node_snapshot_last_age_seconds
              or
            hl_exporter_source_last_valid_age_seconds{source="snapshot_status"}
          ) > 900)
            and on(job, instance)
          (hl_exporter_source_enabled{source="snapshot_status"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="snapshot_status"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="snapshot_status"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="snapshot_status"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Periodic snapshot evidence is stale"
          description: "The latest valid snapshot evidence or exporter receipt is older than 15 minutes. This measures evidence age, not a guaranteed snapshot interval."

      - alert: DiskFillingUp
        expr: |
          (hl_node_disk_statfs_up == 1)
            and (hl_node_disk_total_bytes > 0)
            and ((hl_node_disk_free_bytes / hl_node_disk_total_bytes) < 0.10)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?",node_mode="host"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 10% disk free on NODE_HOME filesystem"
          description: "The filesystem holding NODE_HOME has less than 10% available space."

      - alert: DiskFillingUpWarning
        expr: |
          (hl_node_disk_statfs_up == 1)
            and (hl_node_disk_total_bytes > 0)
            and ((hl_node_disk_free_bytes / hl_node_disk_total_bytes) >= 0.10)
            and ((hl_node_disk_free_bytes / hl_node_disk_total_bytes) < 0.20)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?",node_mode="host"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 20% disk free on NODE_HOME filesystem"
          description: "The filesystem holding NODE_HOME has less than 20% available space."

      - alert: BugEmitted
        expr: |
          (hl_node_bugs > 0)
            and on(job, instance, source)
          (hl_node_critical_message_projection_available{projection="daily"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The node reported a bug event"
          description: "The current source process generation reports one or more bug events."

  - name: hyperliquid_p2p
    rules:
      - alert: MaxPeersReached
        expr: |
          (increase(hl_p2p_gossip_events_total{event_type="rejecting_gossip_stream_max_peers_reached"}[10m]) > 0)
            and on(job, instance)
          (hl_exporter_source_enabled{source="gossip_connections"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gossip streams were rejected at the peer cap"
          description: "The enabled gossip source recorded a max-peer rejection in the last 10 minutes; a later source read failure does not erase that event."

  - name: hyperliquid_consensus
    rules:
      - alert: BlockApplySlow
        expr: |
          (hl_node_subsystem_latency_p95_seconds{subsystem="node_fast_begin_block_to_commit"} > 0.1)
            and on(job, instance)
          (hl_exporter_source_enabled{source="subsystem_latency"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="subsystem_latency"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="subsystem_latency"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="subsystem_latency"} == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 begin-block to commit latency exceeds 100 ms"
          description: "The latest valid subsystem latency sample exceeds 100 ms for 5 minutes."

      - alert: HyperliquidCoreHeightStalled
        expr: |
          (deriv(hl_core_block_height[5m]) < 1)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?"} == 1)
            and on(job, instance)
          (
            (
              (hl_exporter_source_enabled{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_ever_observed{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_read_ok{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_schema_ok{source="block_fast"} == 1)
            )
            or
            (
              (hl_exporter_source_enabled{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_ever_observed{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_read_ok{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_schema_ok{source="block_legacy"} == 1)
            )
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hyperliquid Core height has stalled"
          description: "Reported Core height has advanced at less than 1 block per second for 5 minutes while the exporter target is scrapeable."

      - alert: HyperliquidCoreHeightSlow
        expr: |
          (deriv(hl_core_block_height[5m]) >= 1)
            and (deriv(hl_core_block_height[5m]) < 5)
            and on(job, instance)
          (up{job=~"hyperliquid|hyperliquid-exporter(/.*)?"} == 1)
            and on(job, instance)
          (
            (
              (hl_exporter_source_enabled{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_ever_observed{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_read_ok{source="block_fast"} == 1)
                and on(job, instance)
              (hl_exporter_source_schema_ok{source="block_fast"} == 1)
            )
            or
            (
              (hl_exporter_source_enabled{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_ever_observed{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_read_ok{source="block_legacy"} == 1)
                and on(job, instance)
              (hl_exporter_source_schema_ok{source="block_legacy"} == 1)
            )
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid Core height is advancing slowly"
          description: "Reported Core height has advanced at least 1 and below 5 blocks per second for 15 minutes while the exporter target is scrapeable."

  - name: hyperliquid_node_state
    rules:
      - alert: PersistedABCIHeightGap
        expr: |
          (hl_node_persisted_abci_height_gap{comparison="fast_minus_slow"} > 100)
            and on(job, instance)
          (hl_exporter_source_enabled{source="node_state"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="node_state"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="node_state"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="node_state"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Persisted Core/ABCI checkpoint gap exceeds 100 blocks"
          description: "The fast-minus-slow persisted checkpoint gap exceeds 100 blocks. This is not current EVM execution lag."

      - alert: HyperliquidEVMTxReceiptCountMismatch
        expr: increase(hl_evm_tx_receipt_count_mismatches_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid EVM transaction and receipt counts differed"
          description: "At least one accepted EVM block had different transaction-array and receipt-array lengths in the last 10 minutes."

      - alert: HyperliquidEVMParseErrors
        expr: |
          sum by(job, instance, stage, reason) (
            increase(hl_evm_parse_errors_total[10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid EVM stream records were rejected"
          description: "The exporter rejected at least one EVM stream record in the last 10 minutes."

  - name: hyperliquid_exporter
    rules:
      - alert: HyperliquidExporterMonitorExited
        expr: |
          (hl_exporter_monitor_registered == 1)
            and
          (hl_exporter_monitor_running == 0)
            and
          (hl_exporter_monitor_exited_seconds > 0)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A registered Hyperliquid exporter monitor is not running"
          description: "A registered exporter monitor has remained stopped for 2 minutes."

      - alert: HyperliquidExporterMonitorPanicked
        expr: increase(hl_exporter_monitor_panics_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A Hyperliquid exporter monitor panicked"
          description: "The exporter recorded at least one monitor panic in the last 10 minutes."

      - alert: HyperliquidExporterErrorReportsDropped
        expr: increase(hl_exporter_monitor_error_drops_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid exporter dropped monitor error reports"
          description: "The exporter dropped at least one error report from monitor {{ $labels.monitor }} in the last 10 minutes."

      - alert: HyperliquidExporterSourceReadOrSchemaFailed
        expr: |
          (hl_exporter_source_enabled == 1)
            and on(job, instance, source)
          (
            (hl_exporter_source_read_ok == 0)
              or
            (hl_exporter_source_schema_ok == 0)
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid exporter source {{ $labels.source }} failed"
          description: "The enabled source has reported a failed read or schema outcome for 10 minutes."

      - alert: HyperliquidUnknownActionTypeObserved
        expr: |
          (
            sum by(job, instance) (
              increase(hl_replica_signed_actions_total{action_type="other"}[10m])
            ) > 0
          )
            or
          (
            sum by(job, instance) (
              increase(hl_mempool_txs_signed_actions_total{type="other"}[10m])
            ) > 0
          )
        labels:
          severity: warning
        annotations:
          summary: "Hyperliquid exporter observed an unknown action type"
          description: "At least one replica or split-client mempool action was classified as other in the last 10 minutes."

      - alert: SoftwareOutdated
        expr: |
          (hl_software_up_to_date == 0)
            and on(job, instance)
          (hl_exporter_source_enabled{source="update"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="update"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="update"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="update"} == 1)
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Local hl-visor binary is out of date"
          description: "The enabled update check reports that the local hl-visor does not match the latest published binary."

      - alert: HyperliquidValidatorAPIStaleFallback
        expr: |
          (hl_validator_api_up == 0)
            and
          (hl_validator_api_cache_stale == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Validator API refresh is using stale fallback data"
          description: "Validator-summary refresh failed and stale cached data has been in use for 5 minutes."

      - alert: HyperliquidTmpMaterialStale
        expr: |
          (hl_node_tmp_material_stale_bytes >= 67108864)
            and on(job, instance)
          (hl_node_tmp_scan_up == 1)
            and on(job, instance)
          (hl_exporter_source_enabled{source="tmp_dir"} == 1)
            and on(job, instance)
          (hl_exporter_source_ever_observed{source="tmp_dir"} == 1)
            and on(job, instance)
          (hl_exporter_source_read_ok{source="tmp_dir"} == 1)
            and on(job, instance)
          (hl_exporter_source_schema_ok{source="tmp_dir"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Stale non-receipt tmp data is accumulating"
          description: "The latest complete tmp scan found at least 64 MiB of non-receipt material older than 24 hours."
